version: 2
updates:
  - package-ecosystem: pip
    directories: [/backend, /tools/security]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      python-compatible:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      frontend-compatible:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions-compatible:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /infra/postgis]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      base-images-compatible:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    allow:
      - dependency-name: redis
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      redis-compatible:
        patterns: [redis]
        update-types: [minor, patch]
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      providers-compatible:
        patterns: ['*']
        update-types: [minor, patch]
