global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: emergency-api
    metrics_path: /metrics
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /run/monitoring/metrics_token
    static_configs:
      - targets: ['api:8000', 'api2:8000']
        labels:
          cluster: local
