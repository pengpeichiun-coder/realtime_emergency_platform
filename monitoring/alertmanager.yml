global:
  resolve_timeout: 1m
route:
  receiver: local-test-only
  group_by: [cluster, job, alertname]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
receivers:
  - name: local-test-only
    webhook_configs:
      - url: http://alert-receiver:8080/alerts
        send_resolved: true
        max_alerts: 20
        timeout: 5s
