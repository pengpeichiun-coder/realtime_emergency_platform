worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $hsts_header { default ""; https "max-age=31536000"; }
    resolver 127.0.0.11 valid=10s;
    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 256k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' ws: wss:; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security $hsts_header always;
        root /usr/share/nginx/html;
        set $api_upstream http://api:8000;
        location = /health { access_log off; default_type text/plain; return 200 'ok'; }
        location /api/ {
            proxy_pass $api_upstream;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Replace caller-supplied forwarding data. The API ignores forwarding
            # headers unless the transport peer is in TRUSTED_PROXY_CIDRS.
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location /ws/ {
            proxy_pass $api_upstream;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
        # Swagger is proxied as same-origin HTML + OpenAPI JSON. These location
        # headers intentionally suppress the server-level CSP so the nonce-based
        # policy generated by FastAPI remains the sole policy on the UI response.
        location = /docs {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header X-Frame-Options DENY always;
            add_header Strict-Transport-Security $hsts_header always;
        }
        location = /openapi.json {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' ws: wss:; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options DENY always;
            add_header Strict-Transport-Security $hsts_header always;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
